services:
  ntfy:
    image: docker.io/binwiederhier/ntfy:latest
    command: serve
    hostname: ntfy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-init:
    image: localhost/test:docker-moouro-${PYTEST_PG_VERSION:-9.6}
    pull_policy: never
    tty: false
    stdin_open: false
    user: "0:0"
    entrypoint: ["/bin/sh"]
    command: ["-c", "chown -R postgres:postgres /var/lib/restic /var/lib/pgbackrest"]
    volumes:
      - restic:/var/lib/restic
      - pgbackrest:/var/lib/pgbackrest
    restart: "no"

  db:
    image: localhost/test:docker-moouro-${PYTEST_PG_VERSION:-9.6}
    pull_policy: never
    tty: false
    stdin_open: false
    shm_size: 128mb
    depends_on:
      db-init:
        condition: service_completed_successfully
      ntfy:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_db_password
      POSTGRES_USER: postgres
      POSTGRES_ODOO_PASSWORD_FILE: /run/secrets/odoo_db_password
      POSTGRES_ODOO_USER: odoo
      POSTGRES_ODOO_DB: odoodb
      POSTGRES_REPLICATOR_PASSWORD_FILE: /run/secrets/replicator_db_password
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    volumes:
      - ./config/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro,Z # Auto-Generated by pytest
      - ./config/$PYTEST_PG_CONFIG:/etc/postgresql/postgresql.conf:ro,Z
      - ./config/resticprofile.yaml:/etc/resticprofile/profiles.yaml:ro,Z
      - ./config/apprise.yaml:/etc/apprise/apprise.yaml:ro,Z
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,Z
      - restic:/var/lib/restic
      - pgbackrest:/var/lib/pgbackrest
      - filestore:/var/lib/odoo/data
      - db:${PYTEST_PG_DATA_VOLUME:-/var/lib/postgresql/data}
    secrets:
      - restic_password
      - odoo_db_password
      - postgres_db_password
      - replicator_db_password
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    hostname: odoo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_ODOO_USER -d $$POSTGRES_ODOO_DB"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  db-replica:
    image: localhost/test:docker-moouro-${PYTEST_PG_VERSION:-9.6}
    pull_policy: never
    tty: false
    stdin_open: false
    shm_size: 128mb
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_REPLICATION: true
      POSTGRES_MASTER_HOST: odoo-db
      POSTGRES_MASTER_PORT: 5432
      POSTGRES_MASTER_REPLICATOR_USER: replicator
      POSTGRES_MASTER_REPLICATOR_PASSWORD_FILE: /run/secrets/replicator_db_password
    volumes:
      - ./config/replicator.postgresql.conf:/etc/postgresql/postgresql.conf:ro,Z
      - db-replica:${PYTEST_PG_DATA_VOLUME:-/var/lib/postgresql/data}
    secrets:
      - postgres_db_password
      - replicator_db_password
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    hostname: odoo-db-replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  odoo:
    image: localhost/test:docker-moouro-odoo-${PYTEST_PG_VERSION:-9.6}
    pull_policy: never
    tty: false
    stdin_open: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8069:8069'
    secrets:
      - odoo_db_password
    environment:
      OCONF__options__log_level: debug
      OCONF__options__dbfilter: odoodb$
      OCONF__options__db_user: odoo
      FOCONF__options__db_password: /run/secrets/odoo_db_password
      OCONF__options__db_host: odoo-db
      OCONF__options__db_name: odoodb
      OCONF__options__proxy_mode: false
      OCONF__options__workers: 0
      OCONF__options__max_cron_threads: 0
      OCONF__options__without_demo: all
      OCONF__options__db_replica_host: odoo-db-replica
      OCONF__options__db_replica_port: 5432
    volumes:
      - filestore:/var/lib/odoo/data
    hostname: odoo


secrets:
  restic_password:
    x-podman.relabel: Z
    file: ./secrets/restic_password.txt
  odoo_db_password:
    x-podman.relabel: Z
    file: ./secrets/odoo_db_password.txt
  postgres_db_password:
    x-podman.relabel: Z
    file: ./secrets/postgres_db_password.txt
  replicator_db_password:
    x-podman.relabel: Z
    file: ./secrets/replicator_db_password.txt

volumes:
  filestore:
  db:
  db-replica:
  restic:
  pgbackrest:
